packages:
  - apps/*
  - packages/*

# One version of each dependency for the whole workspace: a package's manifest says "catalog:".
# `vp add` writes "catalog:" for anything listed here.
catalogMode: prefer

catalog:
  "@base-ui/react": 1.9.0
  "@clerk/clerk-js": 6.41.0
  "@clerk/react": 6.18.0
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/modifiers": 9.0.0
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@edge-runtime/vm": 5.0.0
  "@fontsource-variable/ibm-plex-sans": 5.3.0
  "@fontsource/ibm-plex-mono": 5.3.0
  "@phosphor-icons/react": 2.1.10
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-plugin": 1.168.47
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vercel/config": 0.14.1
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  cn: 0.5.0
  convex: 1.47.0
  convex-helpers: 0.1.128
  convex-test: 0.0.63
  fake-indexeddb: 6.2.6
  fractional-indexing: 4.0.0
  idb-keyval: 6.3.0
  jsdom: 30.1.3
  lucide-react: 1.61.0
  motion: 14.4.0
  playwright-core: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.22.1
  sonner: 2.0.8
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  uuid: 14.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# What a dependency may do beyond installing, set with `pnpm approve`. An agent skill from an approved
# package is linked into .agents/skills and .claude/skills on install, where git ignores it.
permissions:
  "@tanstack/router-plugin":
    skills: true
  esbuild:
    build: false
  # Dependencies of @clerk/clerk-js. Their scripts are not needed: core-js only prints a notice.
  browser-tabs-lock:
    build: false
  core-js:
    build: false
